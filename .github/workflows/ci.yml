name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg flac ripgrep
          command -v ffmpeg
          command -v ffprobe
          command -v flac
          command -v metaflac
          command -v rg
      - name: Format
        run: make fmt-check
      - name: Vet
        run: go vet ./...
      - name: Regenerate templ views
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
      - name: Verify admin UI source and tokens
        run: |
          scripts/verify-ui-source.sh
          go run ./scripts/verify-tokens
      - name: Tests with race detector
        run: go test -race ./...
      - name: Deterministic unmanaged acceptance
        run: go test ./tests/acceptance -count=1
      - name: Migration checksums
        run: go test ./migrations ./internal/platform/sqlite
      - name: Compose model
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Architecture imports
        run: go test ./internal/architecture
      - name: Policy and runbook hygiene
        run: |
          scripts/check-clean-tree.sh
          scripts/check-runbooks.sh
      - name: Generated files are committed
        run: git diff --exit-code

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build service images
        run: DENYRA_RELEASE_REFRESH=ci-${{ github.run_id }} docker compose -f deploy/compose.yaml build --pull
      - name: Smoke service images
        run: DENYRA_TEST_IMAGE_SMOKE=1 DENYRA_IMAGE_TAG=local go test ./tests/integration -run 'ServiceImage|LidarrPluginInstall' -count=1
