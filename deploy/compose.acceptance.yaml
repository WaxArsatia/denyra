services:
  acceptance-fixture:
    image: docker.io/denyra/media-pipeline:local@sha256:ecd2be635ea7b76fde9eb76815f22700a046853690ef65e558f380c59e19ae4e
    platform: linux/amd64
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    entrypoint: ["/app/denyra-acceptance-fixture"]
    command: []
    networks:
      denyra-control:
        ipv4_address: ${DENYRA_ACCEPTANCE_FIXTURE_ADDRESS:-172.30.0.4}
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 20
      test: ["CMD", "/app/media-pipeline", "healthcheck", "--address", "${DENYRA_ACCEPTANCE_FIXTURE_ADDRESS:-172.30.0.4}:18080"]

  media-pipeline:
    environment:
      DENYRA_LIDARR_URL: http://acceptance-fixture:18080
      DENYRA_MUSICBRAINZ_URL: http://acceptance-fixture:18080
      DENYRA_LRCLIB_URL: http://acceptance-fixture:18080
    depends_on:
      acceptance-fixture:
        condition: service_healthy
    ports: !reset []

  acquisition-gateway:
    environment:
      DENYRA_LIDARR_URL: http://acceptance-fixture:18080
    depends_on:
      acceptance-fixture:
        condition: service_healthy
      media-pipeline:
        condition: service_healthy

  navidrome:
    depends_on:
      media-pipeline:
        condition: service_healthy
    ports: !reset []

  live-provider-acceptance:
    image: docker.io/denyra/acquisition-gateway:local@sha256:16783876b1ddbe2bca74ba7c9fbad3b29c71491fd3a323878c290a1ae6e69855
    platform: linux/amd64
    profiles: ["live-provider-acceptance"]
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    command: ["live-provider-acceptance", "--config", "/etc/denyra/config.toml"]
    environment:
      DENYRA_LIVE_PROVIDER_ACCEPTANCE: ${DENYRA_LIVE_PROVIDER_ACCEPTANCE:-NOT_ACCEPTED}
      DENYRA_HTTP_INTERNAL_ADDRESS: ${DENYRA_LIVE_GATEWAY_CONTROL_ADDRESS:-172.30.0.5}:8081
    configs:
      - source: gateway_config
        target: /etc/denyra/config.toml
    secrets:
      - internal_bearer
      - audit_key
      - lidarr_api_key
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/spotiflac
        target: /data/downloads/spotiflac
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/acceptance-gateway
        target: /data/state/gateway
    networks:
      denyra-control:
        ipv4_address: ${DENYRA_LIVE_GATEWAY_CONTROL_ADDRESS:-172.30.0.5}
      denyra-acquisition: {}
