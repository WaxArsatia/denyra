services:
  acceptance-fixture:
    image: denyra/media-pipeline:${DENYRA_IMAGE_TAG:-local}
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    entrypoint: ["/app/denyra-acceptance-fixture"]
    environment:
      DENYRA_ACCEPTANCE_FIXTURE_ADDRESS: 0.0.0.0:18080
      DENYRA_ACCEPTANCE_EVIDENCE_FILE: /acceptance/state.json
    volumes:
      - type: bind
        source: ${DENYRA_HOME:-/srv/denyra}/acceptance
        target: /acceptance
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/srv/denyra/data}/library
        target: /acceptance-library-managed
        read_only: true
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/srv/denyra/data}/library-unmanaged
        target: /acceptance-library-unmanaged
        read_only: true
    networks:
      denyra-control: {}
      denyra-acquisition: {}
      denyra-import: {}
      denyra-upload: {}
      denyra-playback: {}
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30
      test: ["CMD", "/app/media-pipeline", "healthcheck", "--address", "127.0.0.1:18080"]

  reconciler:
    command:
      - --lidarr-url
      - http://acceptance-fixture:18080
      - --lidarr-api-key-file
      - /run/secrets/lidarr_api_key
      - --slskd-url
      - http://slskd:5030
      - --slskd-api-key-file
      - /run/secrets/slskd_api_key
      - --sftpgo-url
      - http://acceptance-fixture:18080
      - --sftpgo-admin-file
      - /run/secrets/sftpgo_admin
      - --sftpgo-upload-file
      - /run/secrets/sftpgo_upload
      - --navidrome-url
      - http://acceptance-fixture:18080
      - --navidrome-admin-file
      - /run/secrets/navidrome_admin
    depends_on:
      acceptance-fixture:
        condition: service_healthy

  media-pipeline:
    environment:
      DENYRA_LIDARR_URL: http://acceptance-fixture:18080
      DENYRA_MUSICBRAINZ_URL: http://acceptance-fixture:18080
      DENYRA_LRCLIB_URL: http://acceptance-fixture:18080
      DENYRA_NAVIDROME_URL: http://acceptance-fixture:18080
      DENYRA_SPOTIFY_OEMBED_URL: http://acceptance-fixture:18080
      DENYRA_COVER_ART_URL: http://acceptance-fixture:18080
    depends_on:
      acceptance-fixture:
        condition: service_healthy
    ports: !reset []

  acquisition-gateway:
    environment:
      DENYRA_LIDARR_URL: http://acceptance-fixture:18080
    depends_on:
      acceptance-fixture:
        condition: service_healthy
      media-pipeline:
        condition: service_healthy

  navidrome:
    ports: !reset []

  sftpgo:
    ports: !reset []

  live-provider-acceptance:
    image: denyra/acquisition-gateway:${DENYRA_IMAGE_TAG:-local}
    profiles: ["live-provider-acceptance"]
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    command: ["live-provider-acceptance", "--config", "/etc/denyra/config.toml"]
    environment:
      DENYRA_LIVE_PROVIDER_ACCEPTANCE: ${DENYRA_LIVE_PROVIDER_ACCEPTANCE:-NOT_ACCEPTED}
      DENYRA_HTTP_INTERNAL_ADDRESS: 0.0.0.0:8081
    configs:
      - source: gateway_config
        target: /etc/denyra/config.toml
    secrets:
      - internal_bearer
      - audit_key
      - lidarr_api_key
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/spotiflac
        target: /data/downloads/spotiflac
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/acceptance-gateway
        target: /data/state/gateway
    networks:
      denyra-control: {}
      denyra-acquisition: {}
