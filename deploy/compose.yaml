name: denyra

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  acquisition-gateway:
    image: docker.io/denyra/acquisition-gateway:local@sha256:00ddb7d300362bc5b8831c804dab1f9c7316f2d5c7fd77ed5a241b56f60a120e
    platform: linux/amd64
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    command: ["--config", "/etc/denyra/config.toml"]
    environment:
      DENYRA_HTTP_ADMIN_ADDRESS: 127.0.0.1:8090
      DENYRA_HTTP_INTERNAL_ADDRESS: ${DENYRA_GATEWAY_CONTROL_ADDRESS:-172.30.0.2}:8081
      DENYRA_HTTP_ACQUISITION_EVENT_ADDRESS: 0.0.0.0:8082
    configs:
      - source: gateway_config
        target: /etc/denyra/config.toml
    secrets:
      - internal_bearer
      - audit_key
      - lidarr_api_key
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/spotiflac
        target: /data/downloads/spotiflac
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/gateway
        target: /data/state/gateway
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/backups
        target: /data/backups
    networks:
      denyra-control:
        ipv4_address: ${DENYRA_GATEWAY_CONTROL_ADDRESS:-172.30.0.2}
      denyra-acquisition: {}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/app/acquisition-gateway", "healthcheck", "--address", "${DENYRA_GATEWAY_CONTROL_ADDRESS:-172.30.0.2}:8081"]
    restart: unless-stopped

  media-pipeline:
    image: docker.io/denyra/media-pipeline:local@sha256:5d4138bafb4e6a2a202ef91c7d296cb088c3b6803b4a493f0fed565d0a39bf8c
    platform: linux/amd64
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    command: ["--config", "/etc/denyra/config.toml"]
    environment:
      DENYRA_HTTP_ADMIN_ADDRESS: 0.0.0.0:8090
      DENYRA_HTTP_INTERNAL_ADDRESS: ${DENYRA_PIPELINE_CONTROL_ADDRESS:-172.30.0.3}:8081
    configs:
      - source: pipeline_config
        target: /etc/denyra/config.toml
    secrets:
      - internal_bearer
      - audit_key
      - lidarr_api_key
      - bootstrap_admin
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/slskd
        target: /data/downloads/slskd
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/spotiflac
        target: /data/downloads/spotiflac
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/other
        target: /data/downloads/other
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/incoming/manual
        target: /data/incoming/manual
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/processing/work
        target: /data/processing/work
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/processing/approved
        target: /data/processing/approved
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/quarantine
        target: /data/quarantine
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/library
        target: /data/library
        read_only: true
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/pipeline
        target: /data/state/pipeline
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/backups
        target: /data/backups
    networks:
      denyra-control:
        ipv4_address: ${DENYRA_PIPELINE_CONTROL_ADDRESS:-172.30.0.3}
      denyra-import: {}
    ports:
      - name: admin-http
        target: 8090
        published: "${DENYRA_ADMIN_HOST_PORT:-8090}"
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/app/media-pipeline", "healthcheck", "--address", "${DENYRA_PIPELINE_CONTROL_ADDRESS:-172.30.0.3}:8081"]
    restart: unless-stopped

  lidarr:
    image: docker.io/denyra/lidarr:local@sha256:652020c8c6185e6874944f5177c1a768b0b91113943f1b0ea48f04348384f4a3
    platform: linux/amd64
    environment:
      PUID: "${DENYRA_MEDIA_UID:-1000}"
      PGID: "${DENYRA_MEDIA_GID:-1000}"
      TZ: UTC
    secrets:
      - lidarr_api_key
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/lidarr
        target: /config
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/processing/approved
        target: /data/processing/approved
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/library
        target: /data/library
    networks:
      denyra-acquisition: {}
      denyra-import: {}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ping >/dev/null || exit 1"]
    restart: unless-stopped

  slskd:
    image: ghcr.io/slskd/slskd:0.26.0@sha256:161e214a05b51404f6bb6ddd7e60b66ff674a2d8ad28a88dae5b3c1caf9c8c48
    platform: linux/amd64
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash", "/denyra/slskd-secret-entrypoint.sh", "/entrypoint.sh"]
    command: ["./slskd"]
    configs:
      - source: slskd_secret_entrypoint
        target: /denyra/slskd-secret-entrypoint.sh
    secrets:
      - soulseek_username
      - soulseek_password
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/slskd
        target: /app
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/slskd
        target: /data/downloads/slskd
    networks:
      denyra-acquisition: {}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5030/health || exit 1"]
    restart: unless-stopped

  sftpgo:
    image: docker.io/drakkan/sftpgo:v2.7.5@sha256:d819bcea946470940416b63604f820aee965a02127b07126785e279fa311258e
    platform: linux/amd64
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "false"
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/sftpgo
        target: /var/lib/sftpgo
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/incoming/manual
        target: /data/incoming/manual
    networks:
      denyra-upload: {}
    ports:
      - name: sftp
        target: 2022
        published: "${DENYRA_SFTP_HOST_PORT:-2022}"
        protocol: tcp
      - name: web-admin
        target: 8080
        published: "${DENYRA_SFTPGO_WEB_HOST_PORT:-8080}"
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "sftpgo", "ping"]
    restart: unless-stopped

  navidrome:
    image: docker.io/denyra/navidrome:local@sha256:2abd04221d9848bfe0097836e2a5fdc449bbf37004468a43837a4c3068f2fa40
    platform: linux/amd64
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    environment:
      ND_CONFIGFILE: /etc/denyra/navidrome.toml
      ND_PLUGIN_ND_LYRICS_CONFIG: /etc/denyra/navidrome-lyrics.toml
    configs:
      - source: navidrome_config
        target: /etc/denyra/navidrome.toml
      - source: navidrome_lyrics_config
        target: /etc/denyra/navidrome-lyrics.toml
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/library
        target: /music
        read_only: true
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/navidrome
        target: /data
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/cache/navidrome
        target: /cache
    networks:
      denyra-playback: {}
    ports:
      - name: open-subsonic
        target: 4533
        published: "${DENYRA_NAVIDROME_HOST_PORT:-4533}"
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/app/navidrome", "--version"]
    restart: unless-stopped

  restic:
    image: docker.io/restic/restic:0.19.1@sha256:08916bcda4a4435f9d9828ebb4e91bb7ada3d2c8a53699788930e0ae1bd4fa67
    platform: linux/amd64
    profiles: ["backup"]
    environment:
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    secrets:
      - restic_password
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}
        target: /source
        read_only: true
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/backups
        target: /workspace
      - type: bind
        source: ${DENYRA_RESTIC_REPOSITORY_PATH:-/mnt/denyra-restic}
        target: /repository
    network_mode: none

configs:
  gateway_config:
    file: ./config/gateway.toml
  pipeline_config:
    file: ./config/pipeline.toml
  navidrome_config:
    file: ./config/navidrome.toml
  navidrome_lyrics_config:
    file: ./config/navidrome-lyrics.toml
  slskd_secret_entrypoint:
    file: ./scripts/slskd-secret-entrypoint.sh

secrets:
  internal_bearer:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/internal_bearer
  audit_key:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/audit_key
  bootstrap_admin:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/bootstrap_admin
  lidarr_api_key:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/lidarr_api_key
  soulseek_username:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/soulseek_username
  soulseek_password:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/soulseek_password
  restic_password:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/restic_password

networks:
  denyra-control:
    internal: true
    ipam:
      config:
        - subnet: ${DENYRA_CONTROL_SUBNET:-172.30.0.0/24}
  denyra-acquisition: {}
  denyra-import: {}
  denyra-upload: {}
  denyra-playback: {}
