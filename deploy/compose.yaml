name: denyra

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  acquisition-gateway:
    image: denyra/acquisition-gateway:${DENYRA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/gateway.Dockerfile
      args:
        DENYRA_RELEASE_REFRESH: ${DENYRA_RELEASE_REFRESH:-cached}
        DENYRA_GIT_COMMIT: ${DENYRA_GIT_COMMIT:-unknown}
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    command: ["--config", "/etc/denyra/config.toml"]
    environment:
      DENYRA_HTTP_ADMIN_ADDRESS: 127.0.0.1:8090
      DENYRA_HTTP_INTERNAL_ADDRESS: 0.0.0.0:8081
      DENYRA_HTTP_ACQUISITION_EVENT_ADDRESS: 0.0.0.0:8082
    configs:
      - source: gateway_config
        target: /etc/denyra/config.toml
    secrets:
      - internal_bearer
      - audit_key
      - lidarr_api_key
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/spotiflac
        target: /data/downloads/spotiflac
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/gateway
        target: /data/state/gateway
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/backups
        target: /data/backups
    networks:
      denyra-control: {}
      denyra-acquisition: {}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/app/acquisition-gateway", "healthcheck", "--address", "127.0.0.1:8081"]
    restart: unless-stopped

  media-pipeline:
    image: denyra/media-pipeline:${DENYRA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/pipeline.Dockerfile
      args:
        DENYRA_RELEASE_REFRESH: ${DENYRA_RELEASE_REFRESH:-cached}
        DENYRA_GIT_COMMIT: ${DENYRA_GIT_COMMIT:-unknown}
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    command: ["--config", "/etc/denyra/config.toml"]
    environment:
      DENYRA_HTTP_ADMIN_ADDRESS: 0.0.0.0:8090
      DENYRA_HTTP_INTERNAL_ADDRESS: 0.0.0.0:8081
    configs:
      - source: pipeline_config
        target: /etc/denyra/config.toml
    secrets:
      - internal_bearer
      - audit_key
      - lidarr_api_key
      - bootstrap_admin
      - navidrome_admin
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}
        target: /data
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/library
        target: /data/library
        read_only: true
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/library-unmanaged
        target: /data/library-unmanaged
    networks:
      denyra-control: {}
      denyra-import: {}
      denyra-playback: {}
    ports:
      - name: admin-http
        target: 8090
        published: "${DENYRA_ADMIN_HOST_PORT:-8090}"
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/app/media-pipeline", "healthcheck", "--address", "127.0.0.1:8081"]
    restart: unless-stopped

  reconciler:
    image: denyra/media-pipeline:${DENYRA_IMAGE_TAG:-local}
    profiles: ["setup"]
    entrypoint: ["/app/denyra-reconcile"]
    command:
      - --lidarr-url
      - http://lidarr:8686
      - --lidarr-api-key-file
      - /run/secrets/lidarr_api_key
      - --slskd-url
      - http://slskd:5030
      - --slskd-api-key-file
      - /run/secrets/slskd_api_key
      - --sftpgo-url
      - http://sftpgo:8080
      - --sftpgo-admin-file
      - /run/secrets/sftpgo_admin
      - --sftpgo-upload-file
      - /run/secrets/sftpgo_upload
      - --navidrome-url
      - http://navidrome:4533
      - --navidrome-admin-file
      - /run/secrets/navidrome_admin
    networks:
      denyra-acquisition: {}
      denyra-import: {}
      denyra-upload: {}
      denyra-playback: {}
    secrets:
      - lidarr_api_key
      - slskd_api_key
      - sftpgo_admin
      - sftpgo_upload
      - navidrome_admin

  lidarr:
    image: denyra/lidarr:${DENYRA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/lidarr.Dockerfile
      args:
        DENYRA_RELEASE_REFRESH: ${DENYRA_RELEASE_REFRESH:-cached}
    environment:
      PUID: "${DENYRA_MEDIA_UID:-1000}"
      PGID: "${DENYRA_MEDIA_GID:-1000}"
      TZ: UTC
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/lidarr
        target: /config
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/processing/approved
        target: /data/processing/approved
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/library
        target: /data/library
    networks:
      denyra-acquisition: {}
      denyra-import: {}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ping >/dev/null || exit 1"]
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "/denyra/slskd-secret-entrypoint.sh", "/entrypoint.sh"]
    command: ["./slskd"]
    configs:
      - source: slskd_config
        target: /app/slskd.yml
      - source: slskd_secret_entrypoint
        target: /denyra/slskd-secret-entrypoint.sh
    secrets:
      - soulseek_username
      - soulseek_password
      - slskd_api_key
      - slskd_web_password
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/slskd
        target: /app
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/downloads/slskd
        target: /data/downloads/slskd
    networks:
      denyra-acquisition: {}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5030/health || exit 1"]
    restart: unless-stopped

  sftpgo:
    image: drakkan/sftpgo:latest
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    entrypoint: ["/bin/sh", "/denyra/sftpgo-secret-entrypoint.sh"]
    command: ["sftpgo", "serve"]
    configs:
      - source: sftpgo_secret_entrypoint
        target: /denyra/sftpgo-secret-entrypoint.sh
    secrets:
      - sftpgo_admin
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/sftpgo
        target: /var/lib/sftpgo
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/incoming/manual
        target: /data/incoming/manual
    networks:
      denyra-upload: {}
    ports:
      - name: sftp
        target: 2022
        published: "${DENYRA_SFTP_HOST_PORT:-2022}"
        protocol: tcp
      - name: web-admin
        target: 8080
        published: "${DENYRA_SFTPGO_WEB_HOST_PORT:-8080}"
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "sftpgo", "ping"]
      timeout: 20s
      start_period: 45s
    restart: unless-stopped

  navidrome:
    image: denyra/navidrome:${DENYRA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/navidrome.Dockerfile
      args:
        DENYRA_RELEASE_REFRESH: ${DENYRA_RELEASE_REFRESH:-cached}
    user: "${DENYRA_MEDIA_UID:-1000}:${DENYRA_MEDIA_GID:-1000}"
    environment:
      ND_CONFIGFILE: /etc/denyra/navidrome.toml
      ND_PLUGIN_ND_LYRICS_CONFIG: /etc/denyra/navidrome-lyrics.toml
    configs:
      - source: navidrome_config
        target: /etc/denyra/navidrome.toml
      - source: navidrome_lyrics_config
        target: /etc/denyra/navidrome-lyrics.toml
    volumes:
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/library
        target: /music-managed
        read_only: true
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/library-unmanaged
        target: /music-unmanaged
        read_only: true
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/state/navidrome
        target: /data
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/data}/cache/navidrome
        target: /cache
    networks:
      denyra-playback: {}
    ports:
      - name: open-subsonic
        target: 4533
        published: "${DENYRA_NAVIDROME_HOST_PORT:-4533}"
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/app/navidrome", "--version"]
    restart: unless-stopped

  restic:
    image: restic/restic:latest
    profiles: ["backup"]
    environment:
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    secrets:
      - restic_password
    volumes:
      - type: bind
        source: ${DENYRA_HOME:-/srv/denyra}
        target: /source
        read_only: true
      - type: bind
        source: ${DENYRA_DATA_ROOT:-/srv/denyra/data}/backups
        target: /workspace
        read_only: true
      - type: bind
        source: ${DENYRA_RESTIC_REPOSITORY_PATH:-/mnt/denyra-restic}
        target: /repository
    network_mode: none

configs:
  gateway_config:
    file: ${DENYRA_CONFIG_DIR:-./config}/gateway.toml
  pipeline_config:
    file: ${DENYRA_CONFIG_DIR:-./config}/pipeline.toml
  navidrome_config:
    file: ${DENYRA_CONFIG_DIR:-./config}/navidrome.toml
  navidrome_lyrics_config:
    file: ${DENYRA_CONFIG_DIR:-./config}/navidrome-lyrics.toml
  slskd_secret_entrypoint:
    file: ./scripts/slskd-secret-entrypoint.sh
  slskd_config:
    file: ${DENYRA_CONFIG_DIR:-./config}/slskd.yml
  sftpgo_secret_entrypoint:
    file: ./scripts/sftpgo-secret-entrypoint.sh

secrets:
  internal_bearer:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/internal_bearer
  audit_key:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/audit_key
  bootstrap_admin:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/bootstrap_admin
  navidrome_admin:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/navidrome_admin
  sftpgo_admin:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/sftpgo_admin
  sftpgo_upload:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/sftpgo_upload
  slskd_api_key:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/slskd_api_key
  slskd_web_password:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/slskd_web_password
  lidarr_api_key:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/lidarr_api_key
  soulseek_username:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/soulseek_username
  soulseek_password:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/soulseek_password
  restic_password:
    file: ${DENYRA_SECRETS_DIR:-./secrets}/restic_password

networks:
  denyra-control:
    internal: true
  denyra-acquisition: {}
  denyra-import: {}
  denyra-upload: {}
  denyra-playback: {}
