[http]
admin_address = "127.0.0.1:8090"
internal_address = "172.30.0.2:8081"
acquisition_event_address = "0.0.0.0:8082"
internal_body_limit = 1048576
external_request_timeout = "30s"
external_response_limit = 8388608
internal_replay_attempts = 2
read_header_timeout = "5s"
server_idle_timeout = "30s"
shutdown_timeout = "10s"
healthcheck_timeout = "5s"

[services]
lidarr_url = "http://lidarr:8686"
gateway_url = "http://acquisition-gateway:8081"
pipeline_url = "http://media-pipeline:8081"
musicbrainz_url = "https://musicbrainz.org"
lrclib_url = "https://lrclib.net"

[database]
gateway_path = "/data/state/gateway/denyra.db"

[acquisition]
lidarr_page_size = 100
lease_duration = "15m"
max_inline_transitions = 8

[secrets.internal_bearer]
source = "file"
name = "/run/secrets/internal_bearer"

[secrets.audit_key]
source = "file"
name = "/run/secrets/audit_key"

[secrets.lidarr_api_key]
source = "file"
name = "/run/secrets/lidarr_api_key"
