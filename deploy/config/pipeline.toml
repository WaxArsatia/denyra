# Accepted risk: the Admin UI intentionally binds HTTP to every interface.
# Its session cookie is HttpOnly, SameSite=Strict, Path=/, and has no Secure
# attribute. Limit reachability with host publishing rules and the firewall.
[http]
admin_address = "0.0.0.0:8090"
internal_address = "0.0.0.0:8081"
internal_body_limit = 1048576
admin_mutation_limit = 262144
external_request_timeout = "30s"
external_response_limit = 8388608
internal_replay_attempts = 2
read_header_timeout = "5s"
server_idle_timeout = "30s"
shutdown_timeout = "10s"
healthcheck_timeout = "5s"

[services]
gateway_url = "http://acquisition-gateway:8081"
lidarr_url = "http://lidarr:8686"
pipeline_url = "http://media-pipeline:8081"
musicbrainz_url = "https://musicbrainz.org"
lrclib_url = "https://lrclib.net"
navidrome_url = "http://navidrome:4533"
spotify_oembed_url = "https://open.spotify.com"
cover_art_url = "https://coverartarchive.org"

[database]
pipeline_path = "/data/state/pipeline/denyra.db"

[acquisition]
lidarr_page_size = 100

[validation]
ffprobe_timeout = "30s"
flac_test_timeout = "2m"
metaflac_timeout = "1m"
beets_timeout = "5m"
musicbrainz_rate_interval = "1s"

[sessions]
bootstrap_username = "admin"

[sessions.login_throttle]
failures = 5
window = "15m"
base_delay = "1s"
max_delay = "1m"
capacity = 4096

[uploads]
max_file_bytes = 8589934592
max_session_bytes = 107374182400
max_entries = 1000
browser_concurrency = 3
image_max_bytes = 20971520
image_max_pixels = 40000000

[secrets.internal_bearer]
source = "file"
name = "/run/secrets/internal_bearer"

[secrets.audit_key]
source = "file"
name = "/run/secrets/audit_key"

[secrets.lidarr_api_key]
source = "file"
name = "/run/secrets/lidarr_api_key"

[secrets.bootstrap_admin]
source = "file"
name = "/run/secrets/bootstrap_admin"

[secrets.navidrome_admin]
source = "file"
name = "/run/secrets/navidrome_admin"
